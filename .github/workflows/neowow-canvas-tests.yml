name: NeoWoW canvas checks

on:
  pull_request:
    branches: [main]
    paths: ['webui/**', 'docker/Dockerfile.webui', '.github/workflows/neowow-canvas-tests.yml']
  push:
    branches: [main]
    paths: ['webui/**', 'docker/Dockerfile.webui', '.github/workflows/neowow-canvas-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    env:
      HERMES_HOME: /tmp/neowow-canvas-test-home
      HERMES_WEBUI_TEST_STATE_DIR: /tmp/neowow-canvas-test-state
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install pytest pytest-timeout pyyaml requests
      - name: Canvas, credentials, profiles and CSRF regression checks
        run: >-
          python -m pytest tests/test_neowow_canvas.py tests/test_neowow_canvas_ui.py
          tests/test_neowow_canvas_handoff.py tests/test_neowow_cli.py
          tests/test_neodomain_csrf_bypass.py tests/test_profile_terminal_env.py
          tests/test_profile_env_isolation.py tests/test_issue1909_csp_report_only.py
          tests/test_issue1850_csp_connect_src_jsdelivr.py
          -q --timeout=60 --tb=short
      - name: JavaScript syntax
        run: |
          node --check static/neowow.js
          node --check static/neowow-canvas.js
